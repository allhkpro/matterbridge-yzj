name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: ['20.x', '22.x', '24.x']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install matterbridge for type checking (no-save)
        run: npm install --no-save matterbridge typescript @types/node

      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Build (compile to dist/)
        run: npx tsc

      - name: Verify dist/ entrypoint exists
        run: test -f dist/index.js && test -f dist/index.d.ts

      - name: Verify package.json has no matterbridge dep
        run: |
          if cat package.json | grep -E '"matterbridge"\s*:' > /dev/null; then
            echo "ERROR: matterbridge listed in package.json — Matterbridge plugin loader will reject this."
            echo "Use --no-save during dev install."
            exit 1
          fi
